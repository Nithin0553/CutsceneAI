[project]
name = "cutsceneai"
version = "0.1.0"
description = "Cross-engine cinematic cutscene transfer studio"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "pyyaml>=6.0,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.7",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
