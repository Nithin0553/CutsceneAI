name: CI

on:
  push:
    branches: [main, "foundation/**", "feature/**", "engine/**", "fix/**", "chore/**", "audit/**", "integration/**", "agent/friday-animation-rootmotion-assets-v0.1"]
  pull_request:
    branches: [main, "feature/**", "chore/**", "audit/**", "integration/**"]

jobs:
  python-contracts:
    name: Python tests, source syntax and repository hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install check tools
        run: python -m pip install --upgrade pip && pip install pytest ruff jsonschema cryptography "langgraph>=1.0,<2"
      - name: Check Python module syntax
        run: python -m compileall -q packages tools integrations/unreal
      - name: Run test suite
        run: python -m pytest -q
      - name: Check Studio JavaScript syntax
        run: node --check apps/studio-web/app.js && node --check apps/studio-web/cinematic.js && node tests/studio/test_cinematic_ui.cjs
      - name: Build and independently verify source-only workstation distribution
        run: |
          python tools/build_studio_bundle.py --output "$RUNNER_TEMP/CutSceneAI-Studio-source.zip"
          python tools/build_studio_bundle.py --output "$RUNNER_TEMP/CutSceneAI-Studio-source.zip" --verify
      - name: Publish verified Studio source distribution
        uses: actions/upload-artifact@v4
        with:
          name: studio-source-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/CutSceneAI-Studio-source.zip
          if-no-files-found: error
          retention-days: 30
      - name: Phase 10.4 source-only end-to-end interruption rehearsal
        run: python tools/phase10_4_rehearse.py --output "$RUNNER_TEMP/phase10_4-rehearsal.json"
      - name: Upload Phase 10.4 synthetic rehearsal evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase10-4-synthetic-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/phase10_4-rehearsal.json
          if-no-files-found: error
          retention-days: 30
      - name: Phase 10.5 exact-commit pre-engine freeze and handoff audit
        run: |
          python tools/phase10_5_freeze_preflight.py --repo . --bundle "$RUNNER_TEMP/CutSceneAI-Studio-source.zip" --rehearsal "$RUNNER_TEMP/phase10_4-rehearsal.json" --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/phase10_5-freeze-preflight.json"
      - name: Publish Phase 10.5 software handoff blockers
        uses: actions/upload-artifact@v4
        with:
          name: phase10-5-pre-engine-handoff-${{ github.sha }}
          path: ${{ runner.temp }}/phase10_5-freeze-preflight.json
          if-no-files-found: error
          retention-days: 30
      - name: Ruff test checks
        run: python -m ruff check tests
      - name: Repository hygiene and docs navigation
        run: python tools/repo_check.py
      - name: Train and integrity-verify CED semantic mapping model
        run: |
          mkdir -p ced-training-output
          python tools/train_ced_policy.py train --output ced-training-output/ced-mapping-model-v1.json --summary ced-training-output/ced-training-report-v1.json
          python tools/train_ced_policy.py verify --model ced-training-output/ced-mapping-model-v1.json
      - name: Publish trained CED policy and source-bound report
        uses: actions/upload-artifact@v4
        with:
          name: ced-trained-policy-${{ github.sha }}
          path: ced-training-output/*.json
          if-no-files-found: error
          retention-days: 30

  studio-windows-bootstrap:
    name: Windows Studio dependency bootstrap (no engine)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create isolated Studio environment and verify localhost prerequisites
        shell: pwsh
        run: |
          .\tools\install_studio.ps1 -Python python
          if ($LASTEXITCODE -ne 0) { throw "Studio installation failed." }
          & .\.venv-studio\Scripts\python.exe .\tools\check_studio_setup.py --strict --json
          if ($LASTEXITCODE -ne 0) { throw "Studio diagnostics failed." }
      - name: Build, unzip, install and live-smoke Studio on clean Windows distribution
        shell: pwsh
        run: |
          $Zip = Join-Path $env:RUNNER_TEMP "CutSceneAI-Studio-source-Windows.zip"
          $Dist = Join-Path $env:RUNNER_TEMP "cutsceneai-clean-workstation"
          & .\.venv-studio\Scripts\python.exe .\tools\build_studio_bundle.py --repo . --output $Zip
          if ($LASTEXITCODE -ne 0) { throw "Windows distribution ZIP build failed." }
          & .\.venv-studio\Scripts\python.exe .\tools\build_studio_bundle.py --output $Zip --verify
          if ($LASTEXITCODE -ne 0) { throw "Windows ZIP manifest verification failed." }
          Expand-Archive -LiteralPath $Zip -DestinationPath $Dist
          $Studio = Join-Path $Dist "CutSceneAI-Studio"
          if (-not (Test-Path (Join-Path $Studio "tools\install_studio.ps1") -PathType Leaf)) {
            throw "Extracted source distribution is missing its installer."
          }
          & (Join-Path $Studio "tools\install_studio.ps1") -Python python
          if ($LASTEXITCODE -ne 0) { throw "Clean source ZIP installation failed." }
          $Python = Join-Path $Studio ".venv-studio\Scripts\python.exe"
          & $Python (Join-Path $Studio "tools\check_studio_setup.py") --repo $Studio --strict --json
          if ($LASTEXITCODE -ne 0) { throw "Extracted Studio strict setup failed." }
          & $Python (Join-Path $Studio "tools\studio_startup_smoke.py") --repo $Studio --timeout 70 --output (Join-Path $env:RUNNER_TEMP "phase10_5-windows-startup-smoke.json")
          if ($LASTEXITCODE -ne 0) { throw "Actual packaged Studio localhost UI startup smoke failed." }
      - name: Archive Windows packaged-Studio startup smoke
        uses: actions/upload-artifact@v4
        with:
          name: phase10-5-windows-packaged-studio-startup-${{ github.sha }}
          path: ${{ runner.temp }}/phase10_5-windows-startup-smoke.json
          if-no-files-found: error
          retention-days: 30
