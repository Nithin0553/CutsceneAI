name: CI

on:
  push:
    branches: [main, "foundation/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test tools
        run: python -m pip install --upgrade pip && pip install pytest ruff
      - name: Run contract tests
        run: pytest -q
      - name: Ruff check
        run: ruff check tests
