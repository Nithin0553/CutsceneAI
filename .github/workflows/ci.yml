name: CI

on:
  push:
    branches: [main, "foundation/**", "feature/**", "engine/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main, "feature/**", "chore/**"]

jobs:
  python-contracts:
    name: Python tests, source syntax and repository hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install check tools
        run: python -m pip install --upgrade pip && pip install pytest ruff jsonschema
      - name: Check Python module syntax
        run: python -m compileall -q packages tools integrations/unreal
      - name: Run test suite
        run: python -m pytest -q
      - name: Ruff test checks
        run: python -m ruff check tests
      - name: Repository hygiene and docs navigation
        run: python tools/repo_check.py
