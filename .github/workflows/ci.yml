name: CI

on:
  push:
    branches: [main, "foundation/**", "feature/**", "engine/**", "fix/**", "chore/**", "agent/friday-animation-rootmotion-assets-v0.1"]
  pull_request:
    branches: [main, "feature/**", "chore/**", "integration/agent-native-adapters-v0.1"]

jobs:
  python-contracts:
    name: Python tests, source syntax and repository hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install check tools
        run: python -m pip install --upgrade pip && pip install pytest ruff jsonschema cryptography "langgraph>=1.0,<2"
      - name: Check Python module syntax
        run: python -m compileall -q packages tools integrations/unreal
      - name: Run test suite
        run: python -m pytest -q
      - name: Check Studio JavaScript syntax
        run: node --check apps/studio-web/app.js && node --check apps/studio-web/cinematic.js && node tests/studio/test_cinematic_ui.cjs
      - name: Ruff test checks
        run: python -m ruff check tests
      - name: Repository hygiene and docs navigation
        run: python tools/repo_check.py
      - name: Train and integrity-verify CED semantic mapping model
        run: |
          mkdir -p ced-training-output
          python tools/train_ced_policy.py train --output ced-training-output/ced-mapping-model-v1.json --summary ced-training-output/ced-training-report-v1.json
          python tools/train_ced_policy.py verify --model ced-training-output/ced-mapping-model-v1.json
      - name: Publish trained CED policy and source-bound report
        uses: actions/upload-artifact@v4
        with:
          name: ced-trained-policy-${{ github.sha }}
          path: ced-training-output/*.json
          if-no-files-found: error
          retention-days: 30

  studio-windows-bootstrap:
    name: Windows Studio dependency bootstrap (no engine)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create isolated Studio environment and verify localhost prerequisites
        shell: pwsh
        run: |
          .\tools\install_studio.ps1 -Python python
          if ($LASTEXITCODE -ne 0) { throw "Studio installation failed." }
          & .\.venv-studio\Scripts\python.exe .\tools\check_studio_setup.py --strict --json
          if ($LASTEXITCODE -ne 0) { throw "Studio diagnostics failed." }
